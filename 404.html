<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ANIIPEDIA — Đang mở…</title>
</head>
<body>
  <p>Đang mở Aniipedia…</p>
  <script>
    (() => {
      const path = window.location.pathname || "/";
      const parts = path.split("/").filter(Boolean);
      const isGithubPagesHost = /(^|\.)github\.io$/i.test(window.location.hostname);
      const basePath = isGithubPagesHost && parts.length ? `/${parts[0]}/` : "/";
      const target = new URL(`${basePath}index.html`, window.location.origin);
      target.search = window.location.search;
      target.hash = window.location.hash;

      fetch(target.href, { cache: "no-cache" })
        .then((response) => {
          if (!response.ok) throw new Error(String(response.status));
          return response.text();
        })
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
          history.replaceState(null, "", `${basePath}${window.location.search}${window.location.hash}`);
        })
        .catch(() => {
          window.location.replace(`${basePath}${window.location.search}${window.location.hash}`);
        });
    })();
  </script>
</body>
</html>
